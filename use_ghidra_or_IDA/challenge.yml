category: "Reverse Engineering"
description: |
    The binary takes a number as an argument. It could be anything. 1? 2? Your IQ? Your age?

    One number unlocks the flag. Good luck guessing. (Or just use a decompiler like a normal person.)

    Flag format: `Spark{...}`
value: 500
